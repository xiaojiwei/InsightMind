server:
  port: 8091

spring:
  profiles:
    active: dev
  datasource:
    dynamic:
      primary: mysql
      datasource:
        mysql:
          url: jdbc:mysql://127.0.0.1:3306/indbtest?allowMultiQueries=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&autoReconnect=true
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: YOUR_DB_USER
          password: YOUR_DB_PASSWORD
  rest:
    proxy-host: ""
    proxy-port: 0
    proxy-ignore: ""
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

# Knowledge graph file produced by AD
indicator:
  graph:
    data-path: /Users/xiaojiwei/InsightMind/apps/ad/output/business_kg/indicator-data.ttl

# Redis (no real redis; placeholders only — features that need redis will fail at use)
jedis:
  pool:
    host: 127.0.0.1
    port: 6379
    config:
      maxIdle: 8
      maxTotal: 16
      maxWaitMillis: 2000

redisKeyPrefix: "insightmind:dev:"

# Feature toggles
authSwitch: "off"
debugging: "off"
mysqlDumpSwitch: "off"
tableCheck: "off"
swagger:
  enabled: true

# Misc business defaults referenced via @Value (dummy/local values)
url: "http://localhost:8091"
tables: organization

# AI / DataGPT — empty defaults
ai:
  default:
    meas: ""
  space:
    id: "0"

# Date / dim fixed codes — keep upstream defaults provided by code; safe empties
date:
  nature:
    base:
      code: ""

dim:
  fei_yong_account_code: ""
  fei_yong_account_code_list: ""
  fei_yong_category_code: ""
  fei_yong_category_value: ""
  fei_yong_category_value_desc: ""

meas:
  fei_yong_code: ""

default:
  label:
    name: "本地默认看板"

# Empty placeholders for the bare @Value that have no defaults
dimWithoutSchemaName: ""
dimWithoutTableName: ""

# External integrations — none configured locally
idassHost: ""
pbHost: ""
pbApiSalt: ""

post:
  domain: "http://localhost"
  gateway-token: ""

feishu-robot:
  appId: ""
  appSecret: ""

coa:
  client_id: "15"
  client_secret: ""

ois:
  service:
    identify: "old-data-indicator"

nlp:
  url: ""

licloud-gpt:
  gateway-token: ""

text-to-sql:
  authorization: ""
