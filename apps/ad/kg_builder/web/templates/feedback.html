<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>反馈记录 - InsightMind</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <style>
    :root { --ink:#202832; --muted:#66717e; --line:#d5dbe2; --layer:#f4f6f8; --accent:#52677d; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#eef2f5; font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    .topbar { height:52px; padding:0 22px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
    .topbar a { color:var(--ink); text-decoration:none; font-weight:650; }
    .shell { max-width:1500px; margin:0 auto; padding:18px 22px 40px; }
    .card { border-color:var(--line); border-radius:7px; box-shadow:0 1px 3px rgba(0,0,0,.035); }
    .metric { padding:15px 16px; min-height:86px; }
    .metric .value { font-size:25px; font-weight:720; line-height:1.1; }
    .metric .label { color:var(--muted); margin-top:7px; font-size:12px; }
    .filters { display:grid; grid-template-columns:150px 220px 180px minmax(220px,1fr) auto; gap:8px; }
    .table { margin:0; }
    .table th { white-space:nowrap; background:#f5f7f9; color:#52606d; font-size:12px; }
    .table td { vertical-align:middle; }
    .event-row { cursor:pointer; }
    .event-row:hover td { background:#f6f9fb; }
    .question-cell { max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .code-list { max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#536171; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; }
    .type-explicit { background:#e8f3ec; color:#315e42; }
    .type-execution { background:#e9eff7; color:#38546f; }
    .type-behavior { background:#f3edf8; color:#604577; }
    .type-data { background:#fff2dc; color:#76571f; }
    .status-succeeded { color:#287346; }
    .status-failed,.status-rejected { color:#b33f3f; }
    .status-empty,.status-needs_clarification { color:#9a6a18; }
    .memory-PENDING { background:#fff2dc; color:#76571f; }
    .memory-ENABLED { background:#e8f3ec; color:#315e42; }
    .memory-DISABLED,.memory-STALE { background:#f4e8e8; color:#813f3f; }
    .detail-grid { display:grid; grid-template-columns:150px minmax(0,1fr); gap:8px 14px; font-size:12px; }
    .detail-grid dt { color:var(--muted); font-weight:500; }
    .detail-grid dd { margin:0; overflow-wrap:anywhere; }
    .timeline { border-left:2px solid #d8dee5; margin-left:8px; padding-left:18px; }
    .timeline-item { position:relative; padding:0 0 16px; }
    .timeline-item::before { content:""; position:absolute; left:-24px; top:4px; width:10px; height:10px; border-radius:50%; background:#718398; border:2px solid #fff; }
    pre { white-space:pre-wrap; word-break:break-word; max-height:280px; overflow:auto; background:#f5f7f9; border:1px solid var(--line); border-radius:5px; padding:10px; font-size:11px; }
    .empty { padding:55px 20px; text-align:center; color:var(--muted); }
    @media (max-width:900px) { .filters { grid-template-columns:1fr 1fr; } .shell { padding:12px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/"><i class="bi bi-diagram-3 me-1"></i>InsightMind</a>
    <span class="text-secondary">/</span>
    <strong>反馈记录</strong>
    <span class="text-secondary small">观测与样本审核 · MySQL 存储 · 不自动修改业务图谱</span>
    <input class="form-control form-control-sm ms-auto" id="feedback-token" type="password" autocomplete="off" placeholder="反馈管理 Token" style="width:220px" />
    <button class="btn btn-sm btn-outline-primary" onclick="saveFeedbackToken()">认证</button>
    <button class="btn btn-sm btn-outline-secondary" onclick="reloadAll()"><i class="bi bi-arrow-clockwise me-1"></i>刷新</button>
  </header>

  <main class="shell">
    <div class="d-flex justify-content-between align-items-end mb-3">
      <div>
        <h5 class="mb-1">图谱使用反馈</h5>
        <div class="text-secondary">查看查询执行、用户评价、关键行为和数据库结构变化。</div>
      </div>
      <div class="small text-secondary" id="load-time"></div>
    </div>

    <section class="row g-2 mb-3" id="summary-cards">
      <div class="col-6 col-md"><div class="card metric"><div class="value" id="m-traces">—</div><div class="label">查询 Trace</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value text-success" id="m-success">—</div><div class="label">执行成功</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value text-danger" id="m-failed">—</div><div class="label">执行失败/拒绝</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value text-warning" id="m-negative">—</div><div class="label">显式负反馈</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value" id="m-data">—</div><div class="label">元数据事件</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value text-warning" id="m-pending">—</div><div class="label">待审核样本</div></div></div>
      <div class="col-6 col-md"><div class="card metric"><div class="value" id="m-eval">—</div><div class="label">自动评测用例</div></div></div>
    </section>

    <section class="card mb-3">
      <div class="card-body py-2">
        <div class="filters">
          <select class="form-select form-select-sm" id="f-type">
            <option value="">全部反馈类型</option><option value="execution">执行反馈</option>
            <option value="explicit">显式反馈</option><option value="behavior">行为反馈</option><option value="data">数据反馈</option>
          </select>
          <input class="form-control form-control-sm" id="f-name" placeholder="事件名称，如 QUERY_FAILED" />
          <input class="form-control form-control-sm" id="f-error" placeholder="错误编码" />
          <input class="form-control form-control-sm" id="f-search" placeholder="搜索问题、Trace ID、指标编码" />
          <button class="btn btn-sm btn-primary" onclick="applyFilters()"><i class="bi bi-search me-1"></i>查询</button>
        </div>
      </div>
    </section>

    <section class="card mb-3">
      <div class="card-header bg-white py-2 d-flex align-items-center">
        <div><strong>语义学习样本</strong><span class="text-secondary small ms-2">成功查询先进入 PENDING，审核不会自动修改图谱</span></div>
        <div class="ms-auto d-flex gap-2">
          <select class="form-select form-select-sm" id="m-status" onchange="loadMemories()" style="width:130px">
            <option value="PENDING">待审核</option><option value="ENABLED">已启用</option>
            <option value="DISABLED">已禁用</option><option value="STALE">已失效</option><option value="">全部</option>
          </select>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadMemories()"><i class="bi bi-arrow-clockwise"></i></button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle">
          <thead><tr><th>更新时间</th><th>问题/入口</th><th>语义选择</th><th>状态</th><th>图谱版本</th><th class="text-end">操作</th></tr></thead>
          <tbody id="memory-body"><tr><td colspan="6" class="empty">正在加载…</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-header bg-white py-2 d-flex align-items-center">
        <strong>事件列表</strong><span class="text-secondary small ms-2" id="event-count"></span>
        <div class="ms-auto d-flex gap-1">
          <button class="btn btn-sm btn-outline-secondary" id="prev-btn" onclick="changePage(-1)">上一页</button>
          <span class="btn btn-sm disabled" id="page-label">1</span>
          <button class="btn btn-sm btn-outline-secondary" id="next-btn" onclick="changePage(1)">下一页</button>
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-sm table-hover align-middle">
          <thead><tr><th>时间</th><th>类型</th><th>事件</th><th>问题/对象</th><th>指标与维度</th><th>状态</th><th>错误编码</th><th>Trace</th></tr></thead>
          <tbody id="event-body"><tr><td colspan="8" class="empty">正在加载…</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="detail-panel" style="width:min(720px,96vw)">
    <div class="offcanvas-header border-bottom">
      <div><h6 class="offcanvas-title mb-1">反馈详情</h6><div class="small text-secondary" id="detail-subtitle"></div></div>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="detail-body"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const state = {page:1,pageSize:50,total:0,items:[],memories:[]};
    const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    const fmtTime = value => value ? new Date(value).toLocaleString('zh-CN',{hour12:false}) : '—';
    const short = (value,n=12) => value ? String(value).slice(0,n) : '—';
    const typeName = {execution:'执行',explicit:'显式',behavior:'行为',data:'数据'};
    const feedbackTokenKey = 'insightmindFeedbackToken';
    function feedbackFetch(url, options={}) {
      const token = sessionStorage.getItem(feedbackTokenKey) || '';
      return fetch(url, {...options, headers:{...(options.headers||{}), ...(token ? {'X-InsightMind-Feedback-Token':token} : {})}});
    }
    function saveFeedbackToken() {
      const token = document.getElementById('feedback-token').value.trim();
      if (token) sessionStorage.setItem(feedbackTokenKey, token); else sessionStorage.removeItem(feedbackTokenKey);
      reloadAll();
    }
    document.getElementById('feedback-token').value = sessionStorage.getItem(feedbackTokenKey) || '';

    async function loadSummary() {
      const response = await feedbackFetch('/api/feedback/summary');
      const data = await response.json(); if(!response.ok) throw new Error(data.detail || '反馈管理认证失败');
      const counts = data.traceCounts || {};
      document.getElementById('m-traces').textContent = data.totalTraces || 0;
      document.getElementById('m-success').textContent = counts.succeeded || 0;
      document.getElementById('m-failed').textContent = (counts.failed || 0) + (counts.rejected || 0);
      document.getElementById('m-negative').textContent = data.negativeFeedback || 0;
      document.getElementById('m-data').textContent = data.schemaChanges || 0;
      document.getElementById('m-pending').textContent = (data.memoryCounts || {}).PENDING || 0;
      document.getElementById('m-eval').textContent = data.evalCases || 0;
    }

    async function loadMemories() {
      const body = document.getElementById('memory-body');
      body.innerHTML='<tr><td colspan="6" class="empty"><span class="spinner-border spinner-border-sm me-2"></span>正在加载样本…</td></tr>';
      try {
        const status = document.getElementById('m-status').value;
        const params = new URLSearchParams({page:1,pageSize:20}); if(status) params.set('status',status);
        const response = await feedbackFetch('/api/feedback/memories?' + params);
        const data = await response.json(); if(!response.ok) throw new Error(data.detail || '样本加载失败');
        state.memories = data.items || [];
        if(!state.memories.length){body.innerHTML='<tr><td colspan="6" class="empty">当前状态下没有样本</td></tr>';return;}
        body.innerHTML=state.memories.map((item,index)=>{
          const selection=item.plan?.selection || {};
          const codes=[...(selection.measureCodes||[]),...(selection.dimensionCodes||[])].join(', ');
          const actions=item.status==='PENDING' ? `<button class="btn btn-sm btn-outline-success" onclick="reviewMemory(event,${index},'ENABLED')">启用</button><button class="btn btn-sm btn-outline-danger" onclick="reviewMemory(event,${index},'DISABLED')">禁用</button>` : `<button class="btn btn-sm btn-outline-secondary" onclick="reviewMemory(event,${index},'PENDING')">重审</button>`;
          return `<tr class="event-row" onclick="showTrace('${esc(item.traceId)}')">
            <td class="text-nowrap">${esc(fmtTime(item.updatedAt))}</td><td class="question-cell" title="${esc(item.question)}">${esc(item.question||item.traceId)}</td>
            <td class="code-list" title="${esc(codes)}">${esc(codes||'—')}</td><td><span class="badge memory-${esc(item.status)}">${esc(item.status)}</span></td>
            <td><code>${esc(short(item.businessKgHash,10))}</code></td><td class="text-end text-nowrap" onclick="event.stopPropagation()">${actions}<button class="btn btn-sm btn-outline-primary ms-1" onclick="addEvalCase(event,'${esc(item.traceId)}')">加入评测</button></td></tr>`;
        }).join('');
      } catch(error) {body.innerHTML=`<tr><td colspan="6" class="empty text-danger">${esc(error.message||error)}</td></tr>`;}
    }

    async function reviewMemory(event,index,action){
      event?.stopPropagation(); const item=state.memories[index]; if(!item)return;
      const response=await feedbackFetch(`/api/feedback/memories/${encodeURIComponent(item.memoryId)}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,actor:'feedback_page'})});
      const data=await response.json(); if(!response.ok){alert(data.detail||'审核失败');return;} await Promise.all([loadSummary(),loadMemories()]);
    }

    async function addEvalCase(event,traceId){
      event?.stopPropagation();
      const response=await feedbackFetch(`/api/feedback/traces/${encodeURIComponent(traceId)}/eval-cases`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({priority:'P1',category:'feedback_regression'})});
      const data=await response.json(); if(!response.ok){alert(data.detail||'加入评测失败');return;} await loadSummary(); alert('已加入自动评测用例');
    }

    function queryParams() {
      const params = new URLSearchParams({page:state.page,pageSize:state.pageSize});
      [['eventType','f-type'],['eventName','f-name'],['errorCode','f-error'],['search','f-search']].forEach(([key,id]) => {
        const value = document.getElementById(id).value.trim(); if (value) params.set(key,value);
      });
      return params;
    }

    async function loadEvents() {
      const body = document.getElementById('event-body');
      body.innerHTML = '<tr><td colspan="8" class="empty"><span class="spinner-border spinner-border-sm me-2"></span>正在加载…</td></tr>';
      try {
        const response = await feedbackFetch('/api/feedback/events?' + queryParams());
        const data = await response.json(); if(!response.ok) throw new Error(data.detail || '反馈管理认证失败');
        state.items = data.items || []; state.total = data.total || 0;
        document.getElementById('event-count').textContent = `共 ${state.total} 条`;
        document.getElementById('page-label').textContent = `第 ${state.page} 页`;
        document.getElementById('prev-btn').disabled = state.page <= 1;
        document.getElementById('next-btn').disabled = state.page * state.pageSize >= state.total;
        if (!state.items.length) { body.innerHTML='<tr><td colspan="8" class="empty"><i class="bi bi-inbox fs-3 d-block mb-2"></i>没有符合条件的反馈记录</td></tr>'; return; }
        body.innerHTML = state.items.map((item,index) => {
          const codes = [...(item.measureCodes || []),...(item.dimensionCodes || [])].join(', ');
          const objectText = item.question || item.payload?.resourceId || item.payload?.table || item.payload?.column || item.payload?.path || '—';
          return `<tr class="event-row" onclick="showEvent(${index})">
            <td class="text-nowrap">${esc(fmtTime(item.createdAt))}</td>
            <td><span class="badge type-${esc(item.eventType)}">${esc(typeName[item.eventType] || item.eventType)}</span></td>
            <td><code>${esc(item.eventName)}</code></td>
            <td class="question-cell" title="${esc(objectText)}">${esc(objectText)}</td>
            <td class="code-list" title="${esc(codes)}">${esc(codes || '—')}</td>
            <td class="status-${esc(item.status)}">${esc(item.status || '—')}</td>
            <td><code>${esc(item.errorCode || '—')}</code></td>
            <td>${item.traceId ? `<button class="btn btn-link btn-sm p-0" onclick="event.stopPropagation();showTraceByIndex(${index})">${esc(short(item.traceId,8))}</button>` : '—'}</td>
          </tr>`;
        }).join('');
        document.getElementById('load-time').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN',{hour12:false});
      } catch (error) {
        body.innerHTML=`<tr><td colspan="8" class="empty text-danger">加载失败：${esc(error.message || error)}</td></tr>`;
      }
    }

    function showEvent(index) {
      const item = state.items[index]; if (!item) return;
      document.getElementById('detail-subtitle').textContent = item.eventName || '';
      document.getElementById('detail-body').innerHTML = `<dl class="detail-grid">
        <dt>事件 ID</dt><dd><code>${esc(item.eventId)}</code></dd><dt>Trace ID</dt><dd>${esc(item.traceId || '—')}</dd>
        <dt>类型</dt><dd>${esc(typeName[item.eventType] || item.eventType)}</dd><dt>来源</dt><dd>${esc(item.source || '—')}</dd>
        <dt>时间</dt><dd>${esc(fmtTime(item.createdAt))}</dd><dt>查询状态</dt><dd>${esc(item.status || '—')}</dd>
        <dt>问题</dt><dd>${esc(item.question || '—')}</dd><dt>错误编码</dt><dd><code>${esc(item.errorCode || '—')}</code></dd>
      </dl><h6 class="mt-4">事件载荷</h6><pre>${esc(JSON.stringify(item.payload || {},null,2))}</pre>
      ${item.traceId ? `<button class="btn btn-sm btn-primary" onclick="showTraceByIndex(${index})">查看完整 Trace</button>` : ''}`;
      bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('detail-panel')).show();
    }

    function showTraceByIndex(index) {
      const item = state.items[index];
      if (item?.traceId) showTrace(item.traceId);
    }

    async function showTrace(traceId) {
      const panel = bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('detail-panel'));
      document.getElementById('detail-subtitle').textContent = 'Trace ' + short(traceId,12);
      document.getElementById('detail-body').innerHTML = '<div class="empty"><span class="spinner-border spinner-border-sm me-2"></span>正在加载 Trace…</div>'; panel.show();
      try {
        const trace = await feedbackFetch('/api/feedback/traces/' + encodeURIComponent(traceId)).then(async r => {if(!r.ok) throw new Error((await r.json()).detail || '加载失败'); return r.json();});
        const events = trace.events || [];
        const plan = trace.semanticPlan?.plan || {};
        const explain = trace.semanticPlan?.explainPlan || {};
        const corrections = trace.corrections || [];
        const memory = trace.memory || null;
        document.getElementById('detail-body').innerHTML = `<dl class="detail-grid">
          <dt>问题</dt><dd>${esc(trace.question || '—')}</dd><dt>状态</dt><dd class="status-${esc(trace.status)}">${esc(trace.status)}</dd>
          <dt>查询模式</dt><dd>${esc(trace.queryMode || '—')}</dd><dt>诊断编码</dt><dd><code>${esc(trace.diagnosticCode || '—')}</code></dd>
          <dt>指标</dt><dd>${esc((trace.measureCodes || []).join(', ') || '—')}</dd><dt>维度</dt><dd>${esc((trace.dimensionCodes || []).join(', ') || '—')}</dd>
          <dt>事实表</dt><dd>${esc((trace.factTables || []).join(', ') || '—')}</dd><dt>返回行数</dt><dd>${esc(trace.resultRowCount ?? '—')}</dd>
          <dt>耗时</dt><dd>${esc(trace.elapsedMs == null ? '—' : trace.elapsedMs + ' ms')}</dd><dt>错误</dt><dd>${esc(trace.errorMessage || '—')}</dd>
          <dt>图谱文件</dt><dd>${esc(trace.businessKgFile || '—')}</dd><dt>图谱 SHA-256</dt><dd><code>${esc(trace.businessKgHash || '—')}</code></dd>
          <dt>开始时间</dt><dd>${esc(fmtTime(trace.createdAt))}</dd><dt>完成时间</dt><dd>${esc(fmtTime(trace.completedAt))}</dd>
        </dl>
        <h6 class="mt-4">语义计划与样本</h6>${trace.semanticPlan ? `<dl class="detail-grid">
          <dt>Plan 版本</dt><dd>${esc(trace.semanticPlan.version)} · <code>${esc(short(trace.semanticPlan.planHash,16))}</code></dd>
          <dt>算法变体</dt><dd>${esc(plan.algorithm?.variant||'default')} · ${esc(plan.algorithm?.reason||'—')}</dd>
          <dt>权限计划</dt><dd>${esc(plan.authorization?.status||'—')} · ${esc(plan.authorization?.note||'')}</dd>
          <dt>样本状态</dt><dd>${memory ? `<span class="badge memory-${esc(memory.status)}">${esc(memory.status)}</span>` : '未进入样本池'}</dd>
          <dt>纠错步骤</dt><dd>${corrections.length ? corrections.map(item=>`${esc(item.correctorCode)}：${esc(item.reason)}`).join('<br>') : '无观测到的规范化修正'}</dd>
        </dl><details class="mt-2"><summary>查看 ExplainPlan</summary><pre>${esc(JSON.stringify(explain,null,2))}</pre></details>
        <button class="btn btn-sm btn-outline-primary mt-2" onclick="addEvalCase(event,'${esc(trace.traceId)}')">加入自动评测</button>` : '<div class="text-secondary">旧 Trace 暂无结构化语义计划。</div>'}
        <h6 class="mt-4 mb-3">事件时间线</h6><div class="timeline">${events.map(event => `<div class="timeline-item">
          <div class="fw-semibold"><span class="badge type-${esc(event.eventType)} me-1">${esc(typeName[event.eventType] || event.eventType)}</span>${esc(event.eventName)}</div>
          <div class="text-secondary small mt-1">${esc(fmtTime(event.createdAt))}</div>
          <pre class="mt-2 mb-0">${esc(JSON.stringify(event.payload || {},null,2))}</pre>
        </div>`).join('') || '<div class="text-secondary">暂无事件</div>'}</div>`;
      } catch (error) { document.getElementById('detail-body').innerHTML=`<div class="alert alert-danger">${esc(error.message || error)}</div>`; }
    }

    function applyFilters(){state.page=1;loadEvents();}
    function changePage(delta){const next=state.page+delta;if(next<1)return;state.page=next;loadEvents();}
    function reloadAll(){Promise.all([loadSummary(),loadMemories(),loadEvents()]);}
    ['f-name','f-error','f-search'].forEach(id => document.addEventListener('DOMContentLoaded',()=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters();})));
    reloadAll();
  </script>
</body>
</html>
