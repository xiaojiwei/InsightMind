<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".13"/></filter></defs>
<rect width="1600" height="940" fill="url(#bg)"/><text x="80" y="82" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700" fill="#102a43">方案定位对比</text><text x="82" y="122" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#627d98">三类系统的核心出发点不同</text>
<g filter="url(#s)"><rect x="80" y="180" width="450" height="610" rx="24" fill="white"/><rect x="575" y="180" width="450" height="610" rx="24" fill="white"/><rect x="1070" y="180" width="450" height="610" rx="24" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/></g>
<text x="305" y="250" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#334155">SuperSonic</text><text x="305" y="305" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#475569">基于语义模型的 ChatBI</text><text x="125" y="380" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• 重点：数据集、指标、维度</text><text x="125" y="425" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• 重点：查询编排与 BI 交互</text><text x="125" y="470" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• 前提：已有语义模型配置</text><text x="125" y="555" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748b">更偏“消费和编排”</text>
<text x="800" y="250" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#334155">大应指标平台 + DataEase</text><text x="800" y="305" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#475569">标准指标管理 + BI 消费</text><text x="620" y="380" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• 大应：指标定义、口径和服务</text><text x="620" y="425" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• DataEase：报表、看板和可视化</text><text x="620" y="470" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#334155">• 重点：标准化管理与消费</text><text x="620" y="555" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#64748b">更偏“中心化指标平台”</text>
<text x="1295" y="250" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#1d4ed8">InsightMind</text><text x="1295" y="305" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#1e40af">知识图谱驱动的动态语义分析</text><text x="1115" y="380" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#1e3a8a">• 自建技术图谱 + 业务图谱</text><text x="1115" y="425" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#1e3a8a">• 自建语义召回、映射与执行能力</text><text x="1115" y="470" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#1e3a8a">• NLQ、Insight、Agent/MCP 闭环</text><text x="1115" y="515" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="23" fill="#1e3a8a">• 不依赖大应指标平台</text><text x="1115" y="560" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#1d4ed8">更偏“动态构建与持续演化”</text>
<rect x="180" y="850" width="1240" height="58" rx="29" fill="#1e3a8a"/><text x="800" y="888" text-anchor="middle" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="white">InsightMind 的核心差异：知识图谱是统一语义中心，而不是外部指标平台的附属消费层</text>
</svg>
