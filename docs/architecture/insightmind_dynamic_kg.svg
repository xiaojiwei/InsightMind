<text x="140" y="255" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#075985">技术图谱（Source KG）</text><text x="140" y="310" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#0c4a6e">数据库 / Schema / 表 / 列</text><text x="140" y="355" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#0c4a6e">字段类型、注释、主键、外键</text><text x="140" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#0c4a6e">表间关系与可用 Join 路径</text><text x="140" y="445" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#0c4a6e">基数、受控样本、敏感字段</text><text x="140" y="490" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#0c4a6e">回答：数据库里有什么？</text>
<text x="940" y="255" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#5b21b6">业务图谱（Business KG）</text><text x="940" y="310" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#4c1d95">指标：名称、定义、口径、单位、公式</text><text x="940" y="355" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#4c1d95">维度：层级、时间属性、物理字段</text><text x="940" y="400" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#4c1d95">指标/维度与事实表的应用关系</text><text x="940" y="445" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#4c1d95">别名、维值、置信度、治理状态</text><text x="940" y="490" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#4c1d95">回答：业务指标是什么意思？</text>
