<text x="140" y="245" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#1e40af">第一层｜动态知识图谱</text><text x="140" y="292" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#1e3a8a">技术图谱：数据库、Schema、表、列、主外键、关系、数据特征</text><text x="140" y="330" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#1e3a8a">业务图谱：指标、维度、口径、层级、别名、维值、事实表关系</text>
<text x="140" y="465" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#166534">第二层｜数据基础能力</text><text x="140" y="512" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#14532d">语义目录、名称/别名/维值召回、规则与向量召回、自然语言语义映射</text><text x="140" y="550" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#14532d">SQL 生成执行、分析洞察、质量校验、版本管理、反馈闭环；Codex 加速构建分析</text>
<text x="140" y="685" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#9a3412">第三层｜构建并发布业务应用</text><text x="140" y="732" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#7c2d12">NLQ 自然语言问数、Insight 智能洞察、Ad-Hoc 查询、看板、Agent / MCP</text><text x="140" y="770" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" fill="#7c2d12">面向不同业务场景组合指标、维度、权限、分析流程和交互方式</text>
