<rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="80" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="700" fill="#102a43">InsightMind 三层架构</text><text x="82" y="122" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#627d98">动态知识图谱 → 数据基础能力 → 构建发布业务应用</text>
